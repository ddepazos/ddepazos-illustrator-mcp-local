<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
 content="default-src 'self' data: blob: file:; img-src 'self' data: blob: file:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'none'; object-src 'none'; frame-src 'none';">
<title>Pazos Halftone Pro</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div><h1>Halftone Pro</h1><small>VECTOR · LOCAL · OFFLINE</small></div>
  <button id="reset">Reset</button>
</header>

<section class="preview">
  <canvas id="preview" width="700" height="430"></canvas>
  <div id="empty">CARGA UNA IMAGEN</div>
</section>

<section class="actions">
  <label class="file">Cargar imagen<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp"></label>
  <button id="generate" class="primary">Crear vectores</button>
</section>

<section class="controls">
  <div class="control"><label>Densidad <b id="densityValue">36</b></label><input id="density" type="range" min="8" max="75" value="36"></div>
  <div class="control"><label>Tamaño máximo <b id="sizeValue">10</b></label><input id="size" type="range" min="2" max="25" value="10"></div>
  <div class="control"><label>Contraste <b id="contrastValue">100%</b></label><input id="contrast" type="range" min="20" max="250" value="100"></div>
  <div class="control"><label>Umbral <b id="thresholdValue">0</b></label><input id="threshold" type="range" min="-100" max="100" value="0"></div>
  <div class="control"><label>Rotación trama <b id="angleValue">0°</b></label><input id="angle" type="range" min="-90" max="90" value="0"></div>
  <div class="control">
    <label>Forma del punto</label>
    <select id="shape">
      <option value="circle">Círculo</option>
      <option value="square">Cuadrado</option>
      <option value="diamond">Rombo</option>
    </select>
  </div>

  <div class="row">
    <label><input id="invert" type="checkbox"> Invertir</label>
    <label><input id="skipWhite" type="checkbox" checked> Eliminar blancos</label>
  </div>

  <div class="note">La imagen se analiza localmente. Cada punto se convierte en un objeto vectorial editable en Illustrator.</div>
</section>

<footer><span id="status">Motor listo</span><span class="offline">● SIN RED</span></footer>
<script src="js/main.js"></script>
</body>
</html>
