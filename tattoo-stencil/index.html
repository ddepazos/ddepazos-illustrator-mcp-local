<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
 content="default-src 'self' data: blob: file:; img-src 'self' data: blob: file:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'none'; object-src 'none'; frame-src 'none';">
<title>Pazos Tattoo Stencil</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div><h1>Tattoo Stencil</h1><small>LOCAL · VECTOR · OFFLINE</small></div>
  <button id="reset">Reset</button>
</header>

<section class="preview">
  <canvas id="preview" width="700" height="430"></canvas>
  <div id="empty">CARGA UNA FOTO</div>
</section>

<section class="actions">
  <label class="file">Cargar foto<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp"></label>
  <button id="generate" class="primary">Crear stencil vectorial</button>
</section>

<section class="modes">
  <button class="mode active" data-mode="lines">Líneas</button>
  <button class="mode" data-mode="lines+dots">Líneas + puntos</button>
  <button class="mode" data-mode="dots">Puntillismo</button>
</section>

<section class="controls">
  <div class="control"><label>Contraste <b id="contrastValue">130%</b></label><input id="contrast" type="range" min="40" max="300" value="130"></div>
  <div class="control"><label>Sensibilidad de borde <b id="edgeValue">70</b></label><input id="edge" type="range" min="10" max="220" value="70"></div>
  <div class="control"><label>Densidad <b id="densityValue">42</b></label><input id="density" type="range" min="18" max="90" value="42"></div>
  <div class="control"><label>Grosor de línea <b id="lineWidthValue">1.2</b></label><input id="lineWidth" type="range" min="0.3" max="4" step="0.1" value="1.2"></div>
  <div class="control"><label>Longitud de línea <b id="lineLengthValue">1.0</b></label><input id="lineLength" type="range" min="0.4" max="2.4" step="0.1" value="1.0"></div>
  <div class="control"><label>Umbral de sombras <b id="shadowValue">145</b></label><input id="shadow" type="range" min="40" max="230" value="145"></div>
  <div class="control"><label>Tamaño máx. punto <b id="dotSizeValue">3.0</b></label><input id="dotSize" type="range" min="0.5" max="7" step="0.1" value="3"></div>

  <div class="row">
    <label><input id="invert" type="checkbox"> Invertir</label>
    <label><input id="simplify" type="checkbox" checked> Simplificar</label>
  </div>

  <div class="note">
    Procesamiento local: escala de grises + Sobel para contornos y muestreo tonal para puntillismo.
    Al aplicar, Illustrator recibe strokes y puntos vectoriales editables.
  </div>
</section>

<footer><span id="status">Motor listo</span><span class="offline">● SIN RED</span></footer>
<script src="js/main.js"></script>
</body>
</html>
