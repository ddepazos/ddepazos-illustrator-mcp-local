name: Validate NFT Contract

on:
  push:
    branches: [main]
    paths:
      - "nft-contract/**"
      - ".github/workflows/validate-nft-contract.yml"
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nft-contract
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compile ERC-721
        run: npm run compile

      - name: Upload contract artifact
        uses: actions/upload-artifact@v4
        with:
          name: pazos-nft-contract
          path: nft-contract/build/PazosNFT.json
          retention-days: 30
