<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
 content="default-src 'self' data: blob: file:; img-src 'self' data: blob: file:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'none'; object-src 'none'; frame-src 'none';">
<title>Pazos Image to Web</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div><h1>Image → Web</h1><small>ILLUSTRATOR 2023 · LOCAL · LOW RESOURCE</small></div>
  <button id="reset">Reset</button>
</header>

<section class="preview">
  <canvas id="preview" width="720" height="420"></canvas>
  <div id="empty">CARGA UNA CAPTURA DE INTERFAZ</div>
</section>

<section class="actions">
  <label class="file">Cargar captura<input id="file" type="file" accept="image/png,image/jpeg,image/webp,image/bmp"></label>
  <button id="analyze" class="primary">Analizar layout</button>
  <button id="generate">Generar HTML/CSS</button>
  <button id="save">Guardar proyecto</button>
</section>

<section class="controls">
  <div class="control">
    <label>Modo</label>
    <select id="mode">
      <option value="recreate">Recrear</option>
      <option value="clean">Interpretar limpio</option>
      <option value="responsive">Responsive</option>
    </select>
  </div>

  <div class="control"><label>Sensibilidad de secciones <b id="sectionSensitivityV">34</b></label><input id="sectionSensitivity" type="range" min="12" max="80" value="34"></div>
  <div class="control"><label>Máx. secciones <b id="maxSectionsV">6</b></label><input id="maxSections" type="range" min="1" max="8" value="6"></div>
  <div class="control"><label>Ancho máximo contenido <b id="maxWidthV">1200px</b></label><input id="maxWidth" type="range" min="760" max="1600" step="20" value="1200"></div>

  <div class="row">
    <label><input id="darkDetect" type="checkbox" checked> Detectar tema oscuro</label>
    <label><input id="responsive" type="checkbox" checked> Media query móvil</label>
  </div>

  <div class="note">
    v0.1 reconstruye estructura, secciones, columnas aproximadas y paleta. No hace OCR pesado: el texto se genera como placeholders editables.
  </div>
</section>

<section class="code">
  <div class="codeHead"><span>HTML</span><span>CSS</span></div>
  <div class="codeGrid">
    <textarea id="htmlCode" spellcheck="false"></textarea>
    <textarea id="cssCode" spellcheck="false"></textarea>
  </div>
</section>

<footer><span id="status">Motor listo</span><span class="offline">● SIN RED</span></footer>
<script src="js/main.js"></script>
</body>
</html>
